services:
  api:
    container_name: pos_app_container
    image: pos-app-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_SSL: "true"
    ports:
      - "3000:3000"
    volumes:
      - pos_app_uploads:/app/uploads
    restart: unless-stopped

volumes:
  pos_app_uploads:
    name: pos_app_uploads
